[project]
name = "lobby"
version = "0.1.0"
description = "A simple anonymous chat application built with Flask."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"flask>=3.1,<4",
]

[dependency-groups]
dev = [
	"pytest>=8,<9",
	"ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]